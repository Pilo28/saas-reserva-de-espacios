<main class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <p class="text-xs font-mono uppercase tracking-wide text-teal-700">Fase 2 · Auth</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-900">Reserva de Espacios</h1>
    <p class="mt-3 text-sm text-slate-600">
      Sesión iniciada como
      <span class="font-medium text-slate-900">{{ auth.user()?.email }}</span>
    </p>
    <button
      (click)="signOut()"
      class="mt-6 rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
    >
      Cerrar sesión
    </button>
  </div>
</main>
